# ld65 para el reproductor del editor: la misma disposición de memoria que el juego (nes.cfg) con un solo
# slot. El archivo es el slot ($A000-$DFFF, con la música y los samples DPCM) seguido del banco de $E000
# (el motor de sonido): 24 KB que el editor carga tal cual en la memoria de su CPU.
MEMORY {
    ZP:    start = $0000, size = $0100, type = rw, file = "";
    RAM:   start = $0300, size = $0500, type = rw, file = "";
    SLOT0: start = $A000, size = $4000, type = ro, file = %O, fill = yes, fillval = $FF;
    FIXE:  start = $E000, size = $2000, type = ro, file = %O, fill = yes, fillval = $FF;
}
SEGMENTS {
    ZEROPAGE: load = ZP,    type = zp;
    BSS:      load = RAM,   type = bss;
    SONG0:    load = SLOT0, type = ro;
    CODE:     load = FIXE,  type = ro;
    ENGINE:   load = FIXE,  type = ro;
    RODATA:   load = FIXE,  type = ro;
}
