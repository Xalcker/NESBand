# Configuración del linker (ld65) para un cartucho MMC3 (mapper 4) de 512 KB de PRG-ROM.
#
# Mapa de la CPU con el MMC3 en "modo de PRG 1":
#   $8000-$9FFF  banco fijo (el penúltimo): nuestro código           -> FIX8
#   $A000-$DFFF  dos bancos intercambiables: el "slot" de la canción -> SLOT0..SLOT30
#   $E000-$FFFF  banco fijo (el último): arranque, motor de sonido, datos, vectores -> FIXE
#
# Cada slot son 16 KB (dos bancos de 8 KB) con la música y los charts de una
# canción, desde $A000. Si la canción trae samples DPCM, van al final del slot
# (el chip de sonido solo puede leer samples de $C000 en adelante); el
# generador los acomoda ahí (ver song.s de cada canción).
#
# El archivo .nes es: encabezado iNES + los 31 slots + FIX8 + FIXE + CHR, en ese orden.
# (31 slots x 16 KB + 16 KB fijos = 512 KB, el máximo del MMC3: bancos de 8 KB de 0 a 63; los dos
# fijos son el 62 y el 63). Los slots que no se usan quedan en $FF. Si cambias la cantidad, cambia
# también el tamaño en el encabezado (main.s), MAX_SONGS en pctools y el límite de build.ps1 / build.sh.

MEMORY {
    # RAM interna del NES: solo 2 KB ($0000-$07FF)
    ZP:   start = $0000, size = $0100, type = rw, file = "";   # zero page: la RAM más rápida
    # $0100-$01FF es la pila (stack) del 6502, no se toca
    OAM:  start = $0200, size = $0100, type = rw, file = "";   # copia de los 64 sprites
    RAM:  start = $0300, size = $0500, type = rw, file = "";   # el resto de variables

    HDR:  start = $0000, size = $0010, type = ro, file = %O, fill = yes, fillval = $00;
    SLOT0: start = $A000, size = $4000, type = ro, file = %O, fill = yes, fillval = $FF, bank = 0;
    SLOT1: start = $A000, size = $4000, type = ro, file = %O, fill = yes, fillval = $FF, bank = 2;
    SLOT2: start = $A000, size = $4000, type = ro, file = %O, fill = yes, fillval = $FF, bank = 4;
    SLOT3: start = $A000, size = $4000, type = ro, file = %O, fill = yes, fillval = $FF, bank = 6;
    SLOT4: start = $A000, size = $4000, type = ro, file = %O, fill = yes, fillval = $FF, bank = 8;
    SLOT5: start = $A000, size = $4000, type = ro, file = %O, fill = yes, fillval = $FF, bank = 10;
    SLOT6: start = $A000, size = $4000, type = ro, file = %O, fill = yes, fillval = $FF, bank = 12;
    SLOT7: start = $A000, size = $4000, type = ro, file = %O, fill = yes, fillval = $FF, bank = 14;
    SLOT8: start = $A000, size = $4000, type = ro, file = %O, fill = yes, fillval = $FF, bank = 16;
    SLOT9: start = $A000, size = $4000, type = ro, file = %O, fill = yes, fillval = $FF, bank = 18;
    SLOT10: start = $A000, size = $4000, type = ro, file = %O, fill = yes, fillval = $FF, bank = 20;
    SLOT11: start = $A000, size = $4000, type = ro, file = %O, fill = yes, fillval = $FF, bank = 22;
    SLOT12: start = $A000, size = $4000, type = ro, file = %O, fill = yes, fillval = $FF, bank = 24;
    SLOT13: start = $A000, size = $4000, type = ro, file = %O, fill = yes, fillval = $FF, bank = 26;
    SLOT14: start = $A000, size = $4000, type = ro, file = %O, fill = yes, fillval = $FF, bank = 28;
    SLOT15: start = $A000, size = $4000, type = ro, file = %O, fill = yes, fillval = $FF, bank = 30;
    SLOT16: start = $A000, size = $4000, type = ro, file = %O, fill = yes, fillval = $FF, bank = 32;
    SLOT17: start = $A000, size = $4000, type = ro, file = %O, fill = yes, fillval = $FF, bank = 34;
    SLOT18: start = $A000, size = $4000, type = ro, file = %O, fill = yes, fillval = $FF, bank = 36;
    SLOT19: start = $A000, size = $4000, type = ro, file = %O, fill = yes, fillval = $FF, bank = 38;
    SLOT20: start = $A000, size = $4000, type = ro, file = %O, fill = yes, fillval = $FF, bank = 40;
    SLOT21: start = $A000, size = $4000, type = ro, file = %O, fill = yes, fillval = $FF, bank = 42;
    SLOT22: start = $A000, size = $4000, type = ro, file = %O, fill = yes, fillval = $FF, bank = 44;
    SLOT23: start = $A000, size = $4000, type = ro, file = %O, fill = yes, fillval = $FF, bank = 46;
    SLOT24: start = $A000, size = $4000, type = ro, file = %O, fill = yes, fillval = $FF, bank = 48;
    SLOT25: start = $A000, size = $4000, type = ro, file = %O, fill = yes, fillval = $FF, bank = 50;
    SLOT26: start = $A000, size = $4000, type = ro, file = %O, fill = yes, fillval = $FF, bank = 52;
    SLOT27: start = $A000, size = $4000, type = ro, file = %O, fill = yes, fillval = $FF, bank = 54;
    SLOT28: start = $A000, size = $4000, type = ro, file = %O, fill = yes, fillval = $FF, bank = 56;
    SLOT29: start = $A000, size = $4000, type = ro, file = %O, fill = yes, fillval = $FF, bank = 58;
    SLOT30: start = $A000, size = $4000, type = ro, file = %O, fill = yes, fillval = $FF, bank = 60;
    FIX8: start = $8000, size = $2000, type = ro, file = %O, fill = yes, fillval = $FF, bank = 62;
    FIXE: start = $E000, size = $2000, type = ro, file = %O, fill = yes, fillval = $FF, bank = 63;
    CHR:  start = $0000, size = $4000, type = ro, file = %O, fill = yes, fillval = $00;   # 16 KB: 4 KB de tiles + 3 bancos de 2 KB del escenario
}

SEGMENTS {
    ZEROPAGE: load = ZP,   type = zp;
    OAM:      load = OAM,  type = bss, align = $100;
    BSS:      load = RAM,  type = bss;
    HEADER:   load = HDR,  type = ro;
    CODE:     load = FIX8, type = ro;
    STARTUP:  load = FIXE, type = ro;
    ENGINE:   load = FIXE, type = ro;
    CODE2:    load = FIXE, type = ro;   # más código del juego: el banco de $8000 (CODE) ya está lleno (ver main.s)
    RODATA:   load = FIXE, type = ro;
    VECTORS:  load = FIXE, type = ro, start = $FFFA;
    SONG0:  load = SLOT0, type = ro, optional = yes;
    SONG1:  load = SLOT1, type = ro, optional = yes;
    SONG2:  load = SLOT2, type = ro, optional = yes;
    SONG3:  load = SLOT3, type = ro, optional = yes;
    SONG4:  load = SLOT4, type = ro, optional = yes;
    SONG5:  load = SLOT5, type = ro, optional = yes;
    SONG6:  load = SLOT6, type = ro, optional = yes;
    SONG7:  load = SLOT7, type = ro, optional = yes;
    SONG8:  load = SLOT8, type = ro, optional = yes;
    SONG9:  load = SLOT9, type = ro, optional = yes;
    SONG10: load = SLOT10, type = ro, optional = yes;
    SONG11: load = SLOT11, type = ro, optional = yes;
    SONG12: load = SLOT12, type = ro, optional = yes;
    SONG13: load = SLOT13, type = ro, optional = yes;
    SONG14: load = SLOT14, type = ro, optional = yes;
    SONG15: load = SLOT15, type = ro, optional = yes;
    SONG16: load = SLOT16, type = ro, optional = yes;
    SONG17: load = SLOT17, type = ro, optional = yes;
    SONG18: load = SLOT18, type = ro, optional = yes;
    SONG19: load = SLOT19, type = ro, optional = yes;
    SONG20: load = SLOT20, type = ro, optional = yes;
    SONG21: load = SLOT21, type = ro, optional = yes;
    SONG22: load = SLOT22, type = ro, optional = yes;
    SONG23: load = SLOT23, type = ro, optional = yes;
    SONG24: load = SLOT24, type = ro, optional = yes;
    SONG25: load = SLOT25, type = ro, optional = yes;
    SONG26: load = SLOT26, type = ro, optional = yes;
    SONG27: load = SLOT27, type = ro, optional = yes;
    SONG28: load = SLOT28, type = ro, optional = yes;
    SONG29: load = SLOT29, type = ro, optional = yes;
    SONG30: load = SLOT30, type = ro, optional = yes;
    CHARS:    load = CHR,  type = ro;
}
