# Configuración del linker (ld65) para un cartucho NROM-256:
#   - 32 KB de PRG-ROM (código y datos), visibles en $8000-$FFFF
#   - 8 KB de CHR-ROM (los dibujos de 8x8 pixeles, "tiles")
#
# El archivo .nes final es: encabezado iNES (16 bytes) + PRG + CHR, en ese orden.

MEMORY {
    # RAM interna del NES: solo 2 KB ($0000-$07FF)
    ZP:   start = $0000, size = $0100, type = rw, file = "";   # zero page: la RAM más rápida
    # $0100-$01FF es la pila (stack) del 6502, no se toca
    OAM:  start = $0200, size = $0100, type = rw, file = "";   # copia de los 64 sprites
    RAM:  start = $0300, size = $0500, type = rw, file = "";   # el resto de variables

    # Lo que sí va dentro del archivo .nes
    HDR:  start = $0000, size = $0010, type = ro, file = %O, fill = yes, fillval = $00;
    PRG:  start = $8000, size = $8000, type = ro, file = %O, fill = yes, fillval = $FF;
    CHR:  start = $0000, size = $2000, type = ro, file = %O, fill = yes, fillval = $00;
}

SEGMENTS {
    ZEROPAGE: load = ZP,  type = zp;
    OAM:      load = OAM, type = bss, align = $100;
    BSS:      load = RAM, type = bss;
    HEADER:   load = HDR, type = ro;
    CODE:     load = PRG, type = ro, start = $8000;
    # Los samples DPCM deben estar en $C000-$FFFF y alineados a 64 bytes
    DPCM:     load = PRG, type = ro, start = $C000, optional = yes;
    RODATA:   load = PRG, type = ro;
    VECTORS:  load = PRG, type = ro, start = $FFFA;
    CHARS:    load = CHR, type = ro;
}
