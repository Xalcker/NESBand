[project]
name = "nesband-tools"
version = "0.1.0"
description = "Herramientas de PC para NESBand: importar canciones (NSF/FamiStudio) y generar charts"
requires-python = ">=3.11"
license = "GPL-2.0-only"
license-files = ["LICENSE"]
dependencies = []

[project.scripts]
nesband = "nesband_tools.cli:main"

[dependency-groups]
dev = ["pytest>=8"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["pctools/nesband_tools"]

[tool.pytest.ini_options]
testpaths = ["pctools/tests"]
